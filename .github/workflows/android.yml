name: Android CI
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build-output.txt
      - name: Post build failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build-output.txt ]; then
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(tail -c 45000 build-output.txt)" || true
          fi
